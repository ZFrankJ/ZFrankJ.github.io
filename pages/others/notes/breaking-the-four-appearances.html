        <p>破除四相，离执去妄。</p>

        <p>无我相，无人相，无众生相，无寿者相。</p>

        <p>当我们不再用“我相”画地为牢、用“人相”制造对立、用“众生相”编织偏见、用“寿者相”恐惧变迁，便能以“空明之心”如实观照万物——如镜子映照山河，不迎不拒，不执不留，在虚妄中见真实，于波动中得安宁。</p>
